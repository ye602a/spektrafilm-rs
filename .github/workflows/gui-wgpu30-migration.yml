name: GUI wgpu30 migration validation

on:
  push:
    branches:
      - feat/rs-gui-egui037-unify-wgpu30

permissions:
  contents: write

jobs:
  windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve independent GUI dependencies and check
        shell: pwsh
        run: |
          cargo check -p spektrafilm-gui
          $result = $LASTEXITCODE
          if (git status --short -- Cargo.lock) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build(lock): unify standalone GUI with wgpu 30"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:refs/heads/feat/rs-gui-egui037-unify-wgpu30
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit $result
