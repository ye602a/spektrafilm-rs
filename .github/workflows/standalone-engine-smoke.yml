name: Standalone RS smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-engine:
    name: Windows standalone engine/API
    runs-on: windows-latest
    steps:
      - name: Check out independent RS
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Reject failed Windows builds before packaging old binaries
        shell: pwsh
        run: ./scripts/tests/package_windows_failures.ps1

      - name: Check standalone crates and applications
        run: cargo check --locked -p spektrafilm-math -p spektrafilm-model -p spektrafilm-core -p spektrafilm-gpu -p spektrafilm-cli -p spektrafilm-gui

      - name: Assert standalone GUI and film engine share wgpu 30
        shell: pwsh
        run: |
          @'
          import tomllib
          from pathlib import Path
          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          versions = lambda name: sorted(p["version"] for p in packages if p["name"] == name)
          assert versions("wgpu") == ["30.0.1"], f"wgpu versions: {versions('wgpu')}"
          assert versions("eframe") == ["0.37.0"], f"eframe versions: {versions('eframe')}"
          assert versions("egui") == ["0.37.0"], f"egui versions: {versions('egui')}"
          assert versions("egui-wgpu") == ["0.37.0"], f"egui-wgpu versions: {versions('egui-wgpu')}"
          '@ | python -


      - name: Compile migrated GPU test suites
        run: cargo test --locked -p spektrafilm-gpu --lib --no-run

      - name: Check and exercise host device boundary
        run: cargo test --locked -p spektrafilm-gpu --test host_device -- --nocapture

      - name: Test CPU reference math and film-model crates
        run: cargo test --locked -p spektrafilm-math -p spektrafilm-model -p spektrafilm-core --lib

      - name: Compile full-chain cache and output regressions
        run: cargo test --locked -p spektrafilm-core -p spektrafilm-gpu --tests --no-run

      - name: Verify FPW resource identities and frozen output sources
        run: |
          python tools/validation/check_fpw_resource_contract.py
          python scripts/verify_calibrated_output_sources.py

      - name: Check accepted FPW stock and calibration contracts
        run: |
          cargo test --locked -p spektrafilm-core --test stock_setup
          cargo test --locked -p spektrafilm-core --test resident_input
          cargo test --locked -p spektrafilm-core --test calibrated_output_v1 cpu_ -- --nocapture
          cargo check --locked -p spektrafilm-core --example fpw_host_contract

      - name: Reject unsupported multilayer requests without requiring CUDA hardware
        run: cargo test --locked -p spektrafilm-gpu --features cuda-backend --lib multilayer_grain_selection_is_rejected_without_initializing_cuda

      - name: Verify engine-owned dependency keys and output geometry
        run: |
          cargo test --locked -p spektrafilm-gpu --lib negative_cache
          cargo test --locked -p spektrafilm-gpu --lib output::tests
          cargo test --locked -p spektrafilm-gpu --lib precise_iir_requires_vulkan_even_when_passthrough_is_available

  linux-vulkan-software:
    name: Linux Vulkan software compute smoke
    runs-on: ubuntu-24.04
    env:
      SPEKTRAFILM_REQUIRE_GPU: "1"
      WGPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Mesa software Vulkan and OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libopenblas-dev

      - name: Inspect available Vulkan adapters
        run: vulkaninfo --summary

      - name: Require a real Vulkan device and submit GPU work
        run: cargo test --locked -p spektrafilm-gpu --test host_device -- --nocapture

      - name: Verify actual source-anchored physical grain on Vulkan
        run: cargo test --locked -p spektrafilm-gpu --test grain_source -- --nocapture

      - name: Exercise source-mapped and multilayer GPU grain on Vulkan
        run: |
          cargo test --locked -p spektrafilm-gpu --lib actual_gpu_grain_follows_source_coordinates -- --nocapture
          cargo test --locked -p spektrafilm-gpu --lib actual_gpu_multilayer_moments_and_controls -- --nocapture
          cargo test --locked -p spektrafilm-gpu --lib actual_gpu_multilayer_requires_iir_capability_before_cache_or_consumer -- --nocapture

      - name: Check GPU work buffers against full physical pipeline
        run: |
          cargo test --locked -p spektrafilm-gpu --lib work_images_ -- --nocapture
          cargo test --locked -p spektrafilm-core --test work_images -- --nocapture

      - name: Qualify precise IIR against all 1215 f64 reference cases on software Vulkan
        run: cargo test --locked -p spektrafilm-gpu --lib actual_gpu_iir_matches_f64_reference -- --ignored --nocapture

      - name: Verify density invalidation and scoped RGB16-region output on Vulkan
        run: |
          cargo test --locked -p spektrafilm-gpu --test output_kernels -- --nocapture
          cargo test --locked -p spektrafilm-core --test negative_cache --test gpu_output -- --nocapture

      - name: Verify FPW resource identities and frozen output sources
        run: |
          python tools/validation/check_fpw_resource_contract.py
          python scripts/verify_calibrated_output_sources.py

      - name: Exercise FPW stock, calibrated output, isolated probes and submission gate
        run: |
          cargo test --locked -p spektrafilm-core --test resident_input --test stock_setup --test calibrated_output_v1 --test probe_isolation --test submission_gate -- --nocapture
          cargo run --locked -p spektrafilm-core --example fpw_host_contract
